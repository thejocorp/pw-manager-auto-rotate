[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaultrotate"
version = "0.1.0"
description = "Rotate a secret everywhere it lives, from one vault, with verification and rollback."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "thejocorp" }]
keywords = ["secrets", "rotation", "vaultwarden", "bitwarden", "homelab", "devops", "security", "self-hosted"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]

[project.scripts]
vaultrotate = "vaultrotate.cli:_run"

[project.urls]
Homepage = "https://github.com/thejocorp/vaultrotate"
Issues = "https://github.com/thejocorp/vaultrotate/issues"

[tool.hatch.build.targets.wheel]
packages = ["vaultrotate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
