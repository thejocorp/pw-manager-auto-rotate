# A manifest lists secrets and, for each, the places a copy lives. No secret values go here,
# so this file can live in git next to your infrastructure code.

# Optional: keep the items in a Bitwarden organization collection (names or ids).
# Leave this out to use your personal vault.
bitwarden:
  organization: Homelab
  collection: Servers

secrets:
  - name: myapp/api-key
    kind: generated          # generated = pwrotate makes a random value; provider = you paste one
    bytes: 32
    places:
      - { host: local, file: /etc/myapp/app.env, format: env, key: API_KEY, mode: "600" }
      - { host: "ssh:deploy@web2.example", file: /etc/myapp/app.env, format: env, key: API_KEY }
      - { host: "ssh:deploy@reports.example", file: /opt/reports/config.json, format: json, key: upstream.api_key }
    restart:
      - { host: local, cmd: systemctl restart myapp }
      - { host: "ssh:deploy@web2.example", cmd: "sudo systemctl restart myapp" }
    check:
      # gets the new value on stdin, so it can prove the key really works
      - host: local
        stdin: true
        cmd: 'read -r key; curl -fsS -H "Authorization: Bearer $key" http://127.0.0.1:8080/health'

  - name: smtp/password
    kind: provider           # your mail provider issues it: pwrotate rotate smtp/password --stdin
    places:
      - { host: local, file: /etc/myapp/mail.ini, format: ini, key: smtp.password }
